# Tushare 官方 Python SDK 数据源插件 (https://tushare.pro)
# runtime=python, loader 启动时会从 requirements.txt 安装 tushare.
# Token 通过 .env 的 TUSHARE_TOKEN 或设置页「数据源卡片」填写(secrets.json 优先).

name: tushare
display_name: "Tushare"
runtime: python
entry: app.plugins.tushare.provider:TushareProvider
check: app.plugins.tushare.provider:availability
datasets: [instruments, daily, adj_factor, minute, financial, dividend]
api_key_env: TUSHARE_TOKEN
description: "Tushare 官方 Python SDK。A 股全市场 stock_basic / 日K / 除权因子 / 分钟K(10000+ 积分 + 历史分钟权限) / 财务(6100+ 积分)。实时行情不支持, 自动回退 TickFlow。拉取按 Tushare 限速(免费档 200 次/分), 单标的逐票调用。"
install_hint: "需先安装依赖: uv pip install --python backend/.venv/bin/python tushare; 或在设置页点击「安装依赖」。配置 Token 在 .env 加 TUSHARE_TOKEN=<your_token>, 或在数据源卡片输入框直接填写。"
homepage: "https://tushare.pro"
